name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # typecheck depends on .next/types, which only exists after a build —
      # must run after, not before, on a fresh checkout.
      - run: npm run build
      - run: npm run typecheck
